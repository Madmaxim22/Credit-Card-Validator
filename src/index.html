<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Validator</title>
</head>
<body>
  <div id="card-widget">
    <div id="card-type" class="card-logos-container"></div>
    <div>
      <input 
        type="text"
        id="card-number"
        placeholder="Введите номер карты"
        maxlength="19"
      />
      <button id="validateCardBtn">Проверить карту</button>
      <div id="message"></div>
    </div>
  </div>

  <footer class="footer">
    Иконки от <a target="_blank" href="https://icons8.com">Icons8</a>
  </footer>
</body>
</html>
